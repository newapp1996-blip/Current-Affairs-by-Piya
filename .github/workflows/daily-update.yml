name: Update Current Affairs

on:

  schedule:

    - cron: "17 */3 * * *"
      timezone: "Asia/Kolkata"

  workflow_dispatch:

permissions:
  contents: write


jobs:

  update-news:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository

        uses: actions/checkout@v4

      - name: Setup Python

        uses: actions/setup-python@v5

        with:
          python-version: "3.11"

      - name: Install dependencies

        run: |

          python -m pip install --upgrade pip

          pip install \
            feedparser \
            requests \
            beautifulsoup4 \
            google-genai

      # ----------------------------------------------------
      # CHECK PYTHON BEFORE RUNNING
      # This catches syntax errors clearly.
      # ----------------------------------------------------

      - name: Check Python syntax

        run: |

          python -m py_compile update_news.py

      # ----------------------------------------------------
      # UPDATE NEWS
      # ----------------------------------------------------

      - name: Update current affairs

        env:

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

        run: |

          python update_news.py

      # ----------------------------------------------------
      # SHOW RESULT
      # ----------------------------------------------------

      - name: Show generated files

        run: |

          echo "===== data.json ====="

          python -c "import json; d=json.load(open('data.json', encoding='utf-8')); print('Current date:', d.get('current_date')); print('Available dates:', len(d.get('available_dates', []))); print('Today articles:', len(d.get('today', {}).get('news', [])))"

          echo "===== DATA DIRECTORY ====="

          find data -maxdepth 1 -type f -name "*.json" | sort

      # ----------------------------------------------------
      # COMMIT
      # ----------------------------------------------------

      - name: Commit updated news

        run: |

          git config user.name "AURA EXAM AI"

          git config user.email "actions@github.com"

          git add data.json data/ update_news.py

          git diff --cached --quiet || git commit -m "Update current affairs"

          git push
