name: Update Current Affairs

on:
  schedule:
    # Runs every 3 hours at 15 minutes past the hour (UTC)
    - cron: "15 */3 * * *"

  # Allows you to run it manually from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install required Python packages
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-genai

      # 4. Run the current affairs updater
      - name: Update news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      # 5. Commit updated data
      - name: Commit updated news
        run: |
          git config user.name "AURA EXAM AI"
          git config user.email "actions@github.com"

          git add data.json data/

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update current affairs"
            git push
          fi
