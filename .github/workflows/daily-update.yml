name: Daily Current Affairs Auto-Update

on:
  schedule:
    # 06:00 AM IST = 00:30 UTC
    - cron: "30 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-daily-update
  cancel-in-progress: true

jobs:

  update-news:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      # -------------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v5

      # -------------------------------------------------------
      # PYTHON
      # -------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # -------------------------------------------------------
      # INSTALL DEPENDENCIES
      # -------------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade feedparser

      # -------------------------------------------------------
      # CHECK GEMINI SECRET
      # -------------------------------------------------------

      - name: Check Gemini API key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing."
            echo "Go to:"
            echo "Repository → Settings → Secrets and variables → Actions"
            echo "and create a repository secret named GEMINI_API_KEY."
            exit 1
          fi

          echo "GEMINI_API_KEY is configured."

      # -------------------------------------------------------
      # RUN PYTHON SCRIPT
      # -------------------------------------------------------

      - name: Run Auto-Fetch Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      # -------------------------------------------------------
      # CHECK CHANGES
      # -------------------------------------------------------

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # -------------------------------------------------------
      # COMMIT + PUSH
      # -------------------------------------------------------

      - name: Commit and Push Updated Data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add index.html

          git commit -m "Auto-update daily current affairs"

          git push

      # -------------------------------------------------------
      # NO CHANGES
      # -------------------------------------------------------

      - name: No changes detected
        if: steps.changes.outputs.changed == 'false'
        run: |
          echo "No changes detected in index.html."
          echo "Nothing to commit."
