name: Update Current Affairs

on:
  schedule:
    # Every 3 hours
    # 00:15, 03:15, 06:15, 09:15, 12:15, 15:15, 18:15, 21:15 UTC
    # = 05:45, 08:45, 11:45, 14:45, 17:45, 20:45, 23:45, 02:45 IST
    - cron: "15 */3 * * *"

  # Manual update button
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-current-affairs-update
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-genai

      - name: Update news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          python update_news.py

      - name: Commit updated news
        run: |
          git config user.name "AURA EXAM AI"
          git config user.email "actions@github.com"

          git add data.json data/

          if git diff --cached --quiet; then
            echo "No news changes to commit."
          else
            git commit -m "Update current affairs"
            git push
          fi
