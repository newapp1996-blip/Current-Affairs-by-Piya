name: Update Current Affairs

on:
  schedule:
    - cron: "15 */3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install feedparser requests beautifulsoup4 google-genai

      - name: Update current affairs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python update_news.py

      - name: Commit updated news
        run: |
          git config user.name "AURA EXAM AI Bot"
          git config user.email "actions@github.com"

          git add data.json data/

          if git diff --cached --quiet; then
            echo "No new news to commit."
          else
            git commit -m "Auto update current affairs"
            git push
          fi
