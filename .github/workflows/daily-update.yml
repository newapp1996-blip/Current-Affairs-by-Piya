name: Update Current Affairs

on:
  schedule:
    # Every 6 hours at :30 UTC
    - cron: "30 */6 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: current-affairs-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-genai
      - name: Update current affairs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          python update_news.py
      - name: Create refresh marker
        run: |
          mkdir -p .github
          echo "Last successful refresh: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/site-refresh.txt
      - name: Commit updated current affairs
        run: |
          git config user.name "AURA EXAM AI"
          git config user.email "actions@github.com"

          git add data.json data/ .github/site-refresh.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update current affairs"
            git push
          fi
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
