name: Update Current Affairs

on:
  schedule:
    # Runs every 3 hours at :30 UTC
    # IST: 00:00, 03:00, 06:00, 09:00,
    #      12:00, 15:00, 18:00, 21:00
    - cron: "30 */3 * * *"

  # Allows manual "Run workflow" from GitHub Actions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aura-current-affairs-update
  cancel-in-progress: false

jobs:
  update-news:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      # --------------------------------------------------
      # 1. CHECKOUT REPOSITORY
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # 2. SETUP PYTHON
      # --------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # --------------------------------------------------
      # 3. INSTALL DEPENDENCIES
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser requests beautifulsoup4 google-genai

      # --------------------------------------------------
      # 4. UPDATE NEWS
      # --------------------------------------------------
      - name: Update current affairs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TZ: Asia/Kolkata
        run: |
          python update_news.py

      # --------------------------------------------------
      # 5. FORCE A NEW SITE UPDATE
      # --------------------------------------------------
      # This guarantees that every successful workflow run
      # creates a repository change, even when there are
      # no new news articles.
      # --------------------------------------------------
      - name: Mark site refresh
        run: |
          mkdir -p .github
          echo "Last successful AURA EXAM AI refresh: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/site-refresh.txt

      # --------------------------------------------------
      # 6. COMMIT EVERYTHING
      # --------------------------------------------------
      - name: Commit updated current affairs and refresh marker
        run: |
          git config user.name "AURA EXAM AI"
          git config user.email "actions@github.com"

          git add data.json data/ .github/site-refresh.txt

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update current affairs and refresh site"
            git push
          fi
