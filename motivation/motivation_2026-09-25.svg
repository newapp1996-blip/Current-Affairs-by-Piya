<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1600"
    height="900"
    viewBox="0 0 1600 900">

    <defs>
        <linearGradient
            id="background"
            x1="0"
            y1="0"
            x2="1"
            y2="1">

            <stop
                offset="0%"
                stop-color="#9a3412"/>

            <stop
                offset="100%"
                stop-color="#ea580c"/>
        </linearGradient>

        <filter
            id="shadow"
            x="-20%"
            y="-20%"
            width="140%"
            height="140%">

            <feDropShadow
                dx="0"
                dy="12"
                stdDeviation="15"
                flood-opacity="0.25"/>
        </filter>
    </defs>

    <rect
        width="1600"
        height="900"
        fill="url(#background)"/>

    <circle
        cx="1320"
        cy="170"
        r="260"
        fill="#ffffff"
        opacity="0.08"/>

    <circle
        cx="1450"
        cy="700"
        r="360"
        fill="#ffffff"
        opacity="0.06"/>

    <circle
        cx="160"
        cy="760"
        r="260"
        fill="#ffffff"
        opacity="0.05"/>

    <rect
        x="170"
        y="150"
        width="1260"
        height="600"
        rx="45"
        fill="#ffffff"
        opacity="0.96"
        filter="url(#shadow)"/>

    <text
        x="800"
        y="270"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="38"
        font-weight="700"
        fill="#9a3412">
        AURA EXAM AI
    </text>

    <text
        x="800"
        y="390"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="800"
        fill="#111827">
        YOUR PREPARATION DEFINES YOUR PERFORMANCE.
    </text>

    <line
        x1="520"
        y1="455"
        x2="1080"
        y2="455"
        stroke="#ea580c"
        stroke-width="8"
        stroke-linecap="round"/>

    <text
        x="800"
        y="545"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="34"
        font-weight="600"
        fill="#374151">
        CURRENT AFFAIRS • EXAM PREPARATION • SUCCESS
    </text>

    <text
        x="800"
        y="635"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="27"
        fill="#6b7280">
        25 September 2026
    </text>

    <text
        x="800"
        y="700"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        fill="#9a3412">
        Stay focused. Keep learning. Keep moving forward.
    </text>

</svg>
