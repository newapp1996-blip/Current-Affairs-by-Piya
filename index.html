<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Current Affairs</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">

    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; line-height: 1.6; }
        .fact-card { background: #f9f9f9; border: 1px solid #e0e0e0; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .nav-container { display: flex; justify-content: space-between; align-items: center; margin: 25px 0; }
        button { padding: 10px 20px; font-weight: bold; cursor: pointer; border-radius: 5px; border: 1px solid #ccc; background: #fff; }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
    </style>
</head>
<body>

    <div id="app">
        <div class="nav-container">
            <button id="prev-btn" onclick="prevArticle()">← Back</button>
            <span id="counter" style="font-weight: bold; color: #555;">Article 0 of 0</span>
            <button id="next-btn" onclick="nextArticle()">Next →</button>
        </div>

        <h1 id="news-headline">Loading...</h1>
        <img id="news-image" src="" alt="Article Image" style="width:100%; max-height:350px; object-fit:cover; border-radius:8px; display:none;">
        
        <h3>Full Article Coverage:</h3>
        <p id="news-body"></p>

        <div class="fact-card">
            <h4>📌 Quick Fact Sheet</h4>
            <p><strong>Important Locations/Plants/Drills:</strong> <span id="news-locations"></span></p>
            <p><strong>Important Dates/Deadlines:</strong> <span id="news-dates"></span></p>
        </div>
    </div>

    <script>
        let articles = [];
        let currentIndex = 0;

        async function initApp() {
            try {
                const response = await fetch('data.json?cache_bust=' + new Date().getTime());
                if (!response.ok) throw new Error("Network response was not ok");
                
                const data = await response.json();
                
                // Flexible extraction regardless of JSON format
                if (data.today && data.today.news) {
                    articles = data.today.news;
                } else if (data.news) {
                    articles = data.news;
                } else if (Array.isArray(data)) {
                    articles = data;
                }

                if (articles && articles.length > 0) {
                    renderArticle();
                } else {
                    document.getElementById('news-headline').innerText = "No articles available today.";
                }
            } catch (err) {
                console.error("Error loading data.json:", err);
                document.getElementById('news-headline').innerText = "Unable to load news data. Please check data.json file.";
            }
        }

        function renderArticle() {
            const current = articles[currentIndex];

            document.getElementById('news-headline').innerHTML = current.headline || "Current Affairs Update";
            document.getElementById('news-body').innerHTML = current.full_article_text || "No detailed text available.";
            document.getElementById('news-locations').innerHTML = current.important_locations || "National Governance";
            document.getElementById('news-dates').innerHTML = current.important_dates || "Ongoing";

            const img = document.getElementById('news-image');
            if (current.image_url) {
                img.src = current.image_url;
                img.style.display = "block";
            } else {
                img.style.display = "none";
            }

            document.getElementById('counter').innerText = `Article ${currentIndex + 1} of ${articles.length}`;
            document.getElementById('prev-btn').disabled = (currentIndex === 0);
            document.getElementById('next-btn').disabled = (currentIndex === articles.length - 1);
        }

        function nextArticle() {
            if (currentIndex < articles.length - 1) {
                currentIndex++;
                renderArticle();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function prevArticle() {
            if (currentIndex > 0) {
                currentIndex--;
                renderArticle();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        initApp();
    </script>
</body>
</html>
