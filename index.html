<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA | AI Daily Exam Current Affairs & Quizzes</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #030712;
      --card-glass: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.12);
      --neon-cyan: #06b6d4;
      --neon-purple: #a855f7;
      --neon-gold: #eab308;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; transition: all 0.25s ease-in-out; }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      background: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      background-attachment: fixed;
    }

    body::before {
      content: '';
      position: fixed;
      top: -10%; left: -10%; width: 120%; height: 120%;
      background: radial-gradient(circle at 50% 20%, rgba(59, 130, 246, 0.15), transparent 40%),
                  radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.15), transparent 40%);
      z-index: -1;
      filter: blur(60px);
    }

    header {
      background: rgba(3, 7, 18, 0.9);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--card-border);
      padding: 15px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.2rem;
      font-weight: 900;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      justify-content: center;
      gap: 10px;
      padding: 15px;
      background: rgba(17, 24, 39, 0.4);
      backdrop-filter: blur(10px);
    }

    nav button {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 20px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.85rem;
    }

    nav button.active {
      color: var(--text-main);
      background: linear-gradient(90deg, rgba(6, 182, 212, 0.2), rgba(168, 85, 247, 0.2));
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
    }

    .container { max-width: 850px; margin: 0 auto; padding: 0 15px 40px; }

    .card {
      background: var(--card-glass);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--neon-cyan);
    }

    .card[data-cat="Defence"]::before { background: #f59e0b; }
    .card[data-cat="Schemes"]::before { background: #10b981; }
    .card[data-cat="International"]::before { background: #06b6d4; }
    .card[data-cat="National"]::before { background: #a855f7; }
    .card[data-cat="Economy"]::before { background: #eab308; }

    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }

    .tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      letter-spacing: 1px;
    }

    .fav-btn {
      background: none; border: none; font-size: 1.4rem; cursor: pointer; color: var(--text-muted);
    }
    .fav-btn.active { color: var(--neon-gold); text-shadow: 0 0 10px var(--neon-gold); }

    .news-img {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      border-radius: 12px;
      margin: 10px 0 15px;
      border: 1px solid var(--card-border);
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin: 15px 0;
      background: rgba(0, 0, 0, 0.3);
      padding: 14px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .info-item { font-size: 0.85rem; line-height: 1.4; }
    .info-item strong { color: var(--neon-cyan); display: block; font-size: 0.75rem; text-transform: uppercase; margin-bottom: 2px; }

    .section-block { margin-top: 10px; font-size: 0.9rem; line-height: 1.5; color: var(--text-main); }
    .section-block strong { color: var(--neon-purple); }

    .quiz-option {
      display: block; width: 100%; padding: 12px 15px; margin: 8px 0;
      background: rgba(255, 255, 255, 0.03); border: 1px solid var(--card-border);
      border-radius: 10px; color: var(--text-main); text-align: left; cursor: pointer;
    }
    .quiz-option:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--neon-cyan); }
    .quiz-option.correct { background: rgba(34, 197, 94, 0.2); border-color: #22c55e; }
    .quiz-option.wrong { background: rgba(239, 68, 68, 0.2); border-color: #ef4444; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="logo">AURA EXAM AI</div>
</header>

<nav>
  <button class="active" onclick="switchTab('news', event)">Daily News (12)</button>
  <button onclick="switchTab('quiz', event)">Daily Quiz</button>
  <button onclick="switchTab('saved', event)">Bookmarks ⭐</button>
</nav>

<div class="container">
  <div id="news-section"></div>
  <div id="quiz-section" class="hidden"></div>
  <div id="saved-section" class="hidden"></div>
</div>

<script>
  let favorites = JSON.parse(localStorage.getItem('aura_favs')) || [];

  const appData = {
    news: [],
    quizzes: []
  };

  function toggleFav(id) {
    if (favorites.includes(id)) {
      favorites = favorites.filter(f => f !== id);
    } else {
      favorites.push(id);
    }
    localStorage.setItem('aura_favs', JSON.stringify(favorites));
    renderNews();
    renderSaved();
  }

  function renderNewsCard(item) {
    return `
      <div class="card" data-cat="${item.category}">
        <div class="card-header">
          <span class="tag">${item.category}</span>
          <button class="fav-btn ${favorites.includes(item.id) ? 'active' : ''}" onclick="toggleFav(${item.id})">★</button>
        </div>
        <h2 style="margin: 8px 0; font-size: 1.25rem;">${item.title}</h2>
        
        ${item.image_url ? `<img class="news-img" src="${item.image_url}" alt="${item.title}" loading="lazy" onerror="this.style.display='none'" />` : ''}

        <div class="info-grid">
          <div class="info-item"><strong>📅 Important Date</strong> ${item.date || 'N/A'}</div>
          <div class="info-item"><strong>📍 Place / Location</strong> ${item.place || 'N/A'}</div>
          <div class="info-item"><strong>👤 Persons / Ministers</strong> ${item.persons_ministers || 'N/A'}</div>
          <div class="info-item"><strong>🎖️ Key Officers</strong> ${item.officers || 'N/A'}</div>
          <div class="info-item"><strong>🌐 Countries / States</strong> ${item.countries_states || 'N/A'}</div>
          <div class="info-item"><strong>🚀 Mission / Project</strong> ${item.mission || 'N/A'}</div>
        </div>

        <div class="section-block">
          <strong>💡 Reason for Importance:</strong> ${item.reason || ''}
        </div>
        <div class="section-block" style="margin-top: 8px;">
          <strong>🎯 Key Conclusion:</strong> ${item.conclusion || ''}
        </div>
      </div>
    `;
  }

  function renderNews() {
    const container = document.getElementById('news-section');
    if (!appData.news || appData.news.length === 0) {
      container.innerHTML = `<div class="card"><p style="text-align: center; color: var(--text-muted);">Fetching latest daily current affairs...</p></div>`;
      return;
    }
    container.innerHTML = appData.news.map(renderNewsCard).join('');
  }

  function renderSaved() {
    const container = document.getElementById('saved-section');
    const savedNews = appData.news.filter(n => favorites.includes(n.id));
    if (savedNews.length === 0) {
      container.innerHTML = `<div class="card"><p style="text-align: center; color: var(--text-muted);">No bookmarked news items yet. Tap the ★ star icon on any news card to save it here!</p></div>`;
      return;
    }
    container.innerHTML = savedNews.map(renderNewsCard).join('');
  }

  function renderQuiz() {
    const container = document.getElementById('quiz-section');
    if (!appData.quizzes || appData.quizzes.length === 0) {
      container.innerHTML = `<div class="card"><p style="text-align: center; color: var(--text-muted);">Daily Quizzes loading...</p></div>`;
      return;
    }
    container.innerHTML = appData.quizzes.map((q, qIndex) => `
      <div class="card">
        <h3>Q${qIndex + 1}: ${q.question}</h3>
        ${q.options.map((opt, oIndex) => `
          <button class="quiz-option" onclick="checkAnswer(this, ${qIndex}, ${oIndex})">${opt}</button>
        `).join('')}
      </div>
    `).join('');
  }

  function checkAnswer(btn, qIdx, selectedOpt) {
    const options = btn.parentElement.querySelectorAll('.quiz-option');
    const correctOpt = appData.quizzes[qIdx].answer;
    options.forEach((b, i) => {
      b.disabled = true;
      if (i === correctOpt) b.classList.add('correct');
      else if (i === selectedOpt) b.classList.add('wrong');
    });
  }

  function switchTab(tab, evt) {
    document.getElementById('news-section').classList.add('hidden');
    document.getElementById('quiz-section').classList.add('hidden');
    document.getElementById('saved-section').classList.add('hidden');
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));

    if (tab === 'news') document.getElementById('news-section').classList.remove('hidden');
    else if (tab === 'quiz') document.getElementById('quiz-section').classList.remove('hidden');
    else if (tab === 'saved') { renderSaved(); document.getElementById('saved-section').classList.remove('hidden'); }
    
    evt.target.classList.add('active');
  }

  renderNews();
  renderQuiz();
</script>
</body>
</html>
