<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AURA EXAM AI - Daily Current Affairs & Quiz</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255, 255, 255, 0.96);
      --primary-red: #e11d48;
      --accent-blue: #0284c7;
      --accent-yellow: #f59e0b;
      --text-dark: #0f172a;
      --text-muted: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 50px;
    }

    header {
      text-align: center;
      padding: 25px 15px 15px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    h1.brand {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 1px;
      background: linear-gradient(90deg, #38bdf8, #f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    /* YOUTUBE BANNER */
    .yt-banner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 12px;
      padding: 8px 18px;
      background: #ff0000;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .yt-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
    }
    .yt-icon {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    /* CONTROLS BAR */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      max-width: 1000px;
      margin: 20px auto 10px;
      padding: 0 15px;
      gap: 12px;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }
    .tab-btn {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }
    .tab-btn.active {
      background: var(--accent-blue);
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
    }

    .date-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
    }
    .date-picker-wrapper label { font-size: 0.85rem; font-weight: 600; }
    select#dateSelect {
      background: #0f172a;
      color: #f8fafc;
      border: 1px solid var(--accent-blue);
      padding: 6px 12px;
      border-radius: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* CONTAINER */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 15px;
    }

    /* INFOGRAPHIC NEWS CARDS */
    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .info-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      border-top: 5px solid var(--primary-red);
      display: flex;
      flex-direction: column;
    }

    .card-header {
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .badge-cat {
      background: var(--primary-red);
      font-family: 'Roboto Condensed', sans-serif;
      text-transform: uppercase;
      font-size: 0.85rem;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 1px;
      font-weight: 700;
    }
    .card-id { font-weight: 700; color: #94a3b8; }

    .card-body {
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 20px;
    }
    @media(max-width: 768px) {
      .card-body { grid-template-columns: 1fr; }
    }

    .card-headline {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.3;
      margin-bottom: 12px;
    }

    .story-lead {
      font-size: 0.98rem;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .story-lead b, .bullet-list b {
      color: #9f1239;
      font-weight: 700;
      background: rgba(244, 63, 94, 0.1);
      padding: 0 3px;
      border-radius: 2px;
    }

    .bullet-list {
      list-style: none;
      margin-bottom: 15px;
    }
    .bullet-list li {
      position: relative;
      padding-left: 20px;
      font-size: 0.92rem;
      color: #475569;
      margin-bottom: 6px;
      line-height: 1.5;
    }
    .bullet-list li::before {
      content: "•";
      color: var(--primary-red);
      font-size: 1.4rem;
      position: absolute;
      left: 0;
      top: -3px;
    }

    .exam-box {
      background: #f1f5f9;
      border-left: 4px solid var(--accent-blue);
      padding: 10px 14px;
      border-radius: 0 8px 8px 0;
      font-size: 0.88rem;
      color: #1e293b;
    }
    .exam-box strong { color: var(--accent-blue); }

    .card-img-container {
      width: 100%;
      height: 220px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* QUIZ SECTION */
    .quiz-section { display: none; }
    .quiz-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }
    .quiz-q {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 15px;
      color: #0f172a;
    }
    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .opt-btn {
      text-align: left;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      background: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .opt-btn:hover { border-color: var(--accent-blue); background: #f0f9ff; }
    .opt-btn.correct { background: #dcfce7 !important; border-color: #16a34a !important; color: #15803d; }
    .opt-btn.wrong { background: #ffe4e6 !important; border-color: #e11d48 !important; color: #be123c; }
  </style>
</head>
<body>

  <header>
    <h1 class="brand">AURA EXAM AI</h1>
    <a href="https://www.youtube.com/@ZerroRatta" target="_blank" class="yt-banner">
      <svg class="yt-icon" viewBox="0 0 24 24">
        <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
      </svg>
      Subscribe on YouTube: Zerro Ratta
    </a>
  </header>

  <div class="controls-bar">
    <div class="nav-tabs">
      <button class="tab-btn active" id="btnNews" onclick="switchTab('news')">Daily News (15)</button>
      <button class="tab-btn" id="btnQuiz" onclick="switchTab('quiz')">Daily Quiz (15)</button>
    </div>

    <div class="date-picker-wrapper">
      <label for="dateSelect">📅 Select Date:</label>
      <select id="dateSelect" onchange="loadDateData(this.value)">
        <!-- Dates populated dynamically -->
      </select>
    </div>
  </div>

  <div class="container">
    <!-- NEWS FEED -->
    <div id="newsSection" class="news-grid"></div>

    <!-- QUIZ FEED -->
    <div id="quizSection" class="quiz-section"></div>
  </div>

  <script>
    let globalPayload = null;
    let currentData = null;

    async function init() {
      try {
        const res = await fetch('data.json');
        globalPayload = await res.json();

        // Populate Date Dropdown
        const dateSelect = document.getElementById('dateSelect');
        dateSelect.innerHTML = globalPayload.available_dates.map(d => 
          `<option value="${d}">${d === '2026-09-20' ? d + ' (Launch Date)' : d}</option>`
        ).join('');

        loadDateData(globalPayload.current_date);
      } catch (err) {
        console.error("Failed loading data.json", err);
      }
    }

    async function loadDateData(selectedDate) {
      document.getElementById('dateSelect').value = selectedDate;
      try {
        if (globalPayload.today && globalPayload.today.date === selectedDate) {
          currentData = globalPayload.today;
        } else {
          const res = await fetch(`data/${selectedDate}.json`);
          currentData = await res.json();
        }
        renderNews();
        renderQuiz();
      } catch (err) {
        console.error("Error loading date file", err);
      }
    }

    function renderNews() {
      const container = document.getElementById('newsSection');
      container.innerHTML = currentData.news.map(item => `
        <div class="info-card">
          <div class="card-header">
            <span class="badge-cat">${item.category}</span>
            <span class="card-id">#${item.id} of 15</span>
          </div>
          <div class="card-body">
            <div>
              <h2 class="card-headline">${item.headline}</h2>
              <div class="story-lead">${item.story_lead}</div>
              <ul class="bullet-list">
                ${item.bullet_points.map(bp => `<li>${bp}</li>`).join('')}
              </ul>
              <div class="exam-box">
                <strong>Exam Relevance:</strong> ${item.exam_relevance}
              </div>
            </div>
            <div class="card-img-container">
              <img src="${item.image_url}" alt="${item.headline}" loading="lazy" />
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderQuiz() {
      const container = document.getElementById('quizSection');
      container.innerHTML = currentData.quizzes.map((q, idx) => `
        <div class="quiz-card">
          <div class="quiz-q">Q${idx + 1}. ${q.question}</div>
          <div class="quiz-options">
            ${q.options.map((opt, i) => `
              <button class="opt-btn" onclick="checkAnswer(this, ${i}, ${q.answer})">${opt}</button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    function checkAnswer(btn, chosen, correct) {
      const parent = btn.parentElement;
      const buttons = parent.querySelectorAll('.opt-btn');
      buttons.forEach((b, idx) => {
        b.disabled = true;
        if (idx === correct) b.classList.add('correct');
        if (idx === chosen && chosen !== correct) b.classList.add('wrong');
      });
    }

    function switchTab(tab) {
      document.getElementById('btnNews').classList.toggle('active', tab === 'news');
      document.getElementById('btnQuiz').classList.toggle('active', tab === 'quiz');
      document.getElementById('newsSection').style.display = tab === 'news' ? 'flex' : 'none';
      document.getElementById('quizSection').style.display = tab === 'quiz' ? 'block' : 'none';
    }

    init();
  </script>
</body>
</html>
