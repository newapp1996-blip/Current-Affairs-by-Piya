<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA EXAM AI - Daily Current Affairs</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        .header-title {
            text-align: center;
            color: var(--accent-color);
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 24px;
        }

        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: #0284c7;
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .tab-content {
            display: none;
            max-width: 800px;
            margin: 0 auto;
        }

        .tab-content.active {
            display: block;
        }

        /* News Cards */
        .news-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .category-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.2);
            color: var(--accent-color);
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .news-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 12px 0;
            line-height: 1.4;
        }

        .news-meta-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
        }

        .news-meta-item strong {
            color: var(--text-color);
        }

        .news-section {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .news-section strong {
            color: var(--accent-color);
        }

        /* Quiz Cards */
        .quiz-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .quiz-question {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .quiz-option {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            color: var(--text-color);
        }

        .quiz-option.correct {
            background-color: #15803d;
            border-color: #22c55e;
        }

        .quiz-option.incorrect {
            background-color: #991b1b;
            border-color: #ef4444;
        }

        .status-msg {
            text-align: center;
            color: var(--text-muted);
            margin-top: 40px;
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div class="header-title">AURA EXAM AI</div>

    <div class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('news')">Daily News (<span id="news-count">0</span>)</button>
        <button class="tab-btn" onclick="switchTab('quiz')">Daily Quiz</button>
    </div>

    <!-- News Tab -->
    <div id="news-tab" class="tab-content active">
        <div id="news-container">
            <div class="status-msg">Loading latest current affairs...</div>
        </div>
    </div>

    <!-- Quiz Tab -->
    <div id="quiz-tab" class="tab-content">
        <div id="quiz-container">
            <div class="status-msg">Loading quizzes...</div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tab === 'news') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('news-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('quiz-tab').classList.add('active');
            }
        }

        async function loadAppData() {
            try {
                // Fetch data.json directly with cache-busting timestamp
                const response = await fetch(`./data.json?v=${new Date().getTime()}`, {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();

                if (data && data.news && data.news.length > 0) {
                    renderNews(data.news);
                    renderQuiz(data.quizzes || []);
                } else {
                    showError("No current affairs available yet. Run the GitHub Action workflow to fetch updates.");
                }
            } catch (err) {
                console.error("Failed to fetch data.json:", err);
                showError("Error loading current affairs data. Please try refreshing.");
            }
        }

        function renderNews(newsList) {
            document.getElementById('news-count').textContent = newsList.length;
            const container = document.getElementById('news-container');
            container.innerHTML = '';

            newsList.forEach(item => {
                const card = document.createElement('div');
                card.className = 'news-card';
                card.innerHTML = `
                    <span class="category-badge">${item.category || 'General'}</span>
                    <h2 class="news-title">${item.title}</h2>
                    <div class="news-meta-grid">
                        <div class="news-meta-item"><strong>Date:</strong> ${item.date || 'N/A'}</div>
                        <div class="news-meta-item"><strong>Place:</strong> ${item.place || 'N/A'}</div>
                        <div class="news-meta-item"><strong>Minister/Personality:</strong> ${item.person_name || 'N/A'}</div>
                        <div class="news-meta-item"><strong>Ministry/Portfolio:</strong> ${item.ministry_portfolio || 'N/A'}</div>
                        <div class="news-meta-item"><strong>Key Officers:</strong> ${item.officers || 'N/A'}</div>
                        <div class="news-meta-item"><strong>States/Countries:</strong> ${item.countries_states || 'N/A'}</div>
                        <div class="news-meta-item"><strong>Mission/Scheme:</strong> ${item.mission || 'N/A'}</div>
                    </div>
                    <div class="news-section"><strong>Exam Relevance:</strong> ${item.reason || ''}</div>
                    <div class="news-section"><strong>Conclusion/Key Takeaway:</strong> ${item.conclusion || ''}</div>
                `;
                container.appendChild(card);
            });
        }

        function renderQuiz(quizList) {
            const container = document.getElementById('quiz-container');
            container.innerHTML = '';

            if (!quizList || quizList.length === 0) {
                container.innerHTML = '<div class="status-msg">No quizzes available for today.</div>';
                return;
            }

            quizList.forEach((quiz, index) => {
                const card = document.createElement('div');
                card.className = 'quiz-card';

                let optionsHtml = '';
                quiz.options.forEach((opt, optIdx) => {
                    optionsHtml += `<button class="quiz-option" onclick="checkAnswer(this, ${optIdx}, ${quiz.answer})">${opt}</button>`;
                });

                card.innerHTML = `
                    <div class="quiz-question">${index + 1}. ${quiz.question}</div>
                    <div class="quiz-options">${optionsHtml}</div>
                `;
                container.appendChild(card);
            });
        }

        function checkAnswer(btn, selectedIdx, correctIdx) {
            const parent = btn.parentElement;
            const buttons = parent.querySelectorAll('.quiz-option');
            buttons.forEach(b => b.disabled = true);

            if (selectedIdx === correctIdx) {
                btn.classList.add('correct');
            } else {
                btn.classList.add('incorrect');
                buttons[correctIdx].classList.add('correct');
            }
        }

        function showError(message) {
            document.getElementById('news-container').innerHTML = `<div class="status-msg">${message}</div>`;
            document.getElementById('quiz-container').innerHTML = `<div class="status-msg">${message}</div>`;
        }

        // Initialize on load
        document.addEventListener('DOMContentLoaded', loadAppData);
    </script>
</body>
</html>
