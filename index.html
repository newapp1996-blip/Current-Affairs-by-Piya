<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AURA EXAM AI - Daily Current Affairs & Quiz</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Roboto+Condensed:wght@700&display=swap" rel="stylesheet" />

  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'en',
        includedLanguages: 'en,hi,pa,bn,ta,te,mr,gu,kn,ml,ur',
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      }, 'google_translate_element');

  <script
    type="text/javascript"

  </script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      --card-bg: rgba(255,255,255,0.97);
      --primary-red: #e11d48;
      --accent-blue: #0284c7;
      --text-dark: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 50px;
    }

    /* ================= HEADER ================= */

    header {
      text-align: center;
      padding: 15px;
      background: rgba(15,23,42,0.94);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(255,255,255,0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 1450px;
      margin: 0 auto 10px;
      gap: 15px;
    }

    .live-clock-box {
      justify-self: start;
      background: linear-gradient(
        135deg,
        rgba(56,189,248,0.15),
        rgba(99,102,241,0.18)
      );

      padding: 8px 15px;
      border-radius: 14px;

      font-size: 0.9rem;
      font-weight: 800;

      color: #7dd3fc;

      border: 1px solid rgba(56,189,248,0.35);

      display: flex;
      align-items: center;
      gap: 7px;

      box-shadow:
        0 0 15px rgba(56,189,248,0.08),
        inset 0 0 10px rgba(255,255,255,0.03);
    }

    #liveClock {
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.5px;
    }

    h1.brand {
      font-size: 2.15rem;
      font-weight: 800;
      letter-spacing: 1px;

      background: linear-gradient(90deg,#38bdf8,#f43f5e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-transform: uppercase;
    }

    .header-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #google_translate_element select {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--accent-blue);
      border-radius: 12px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
    }

    .btn-share-app {
      background: #10b981;
      color: #fff;
      border: none;

      padding: 7px 14px;
      border-radius: 20px;

      font-size: 0.85rem;
      font-weight: 700;

      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-share-app:hover {
      background: #059669;
    }

    .yt-banner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      margin-top: 4px;
      padding: 8px 22px;

      background: #ff0000;
      color: #fff;

      text-decoration: none;
      border-radius: 30px;

      font-weight: 700;
      font-size: 0.92rem;

      box-shadow: 0 4px 15px rgba(255,0,0,0.4);
    }

    .yt-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* ================= PAGE ================= */

    .page-layout {
      display: grid;
      grid-template-columns: 240px 1fr 240px;

      gap: 20px;

      max-width: 1550px;

      margin: 20px auto 0;

      padding: 0 15px;
    }

    @media(max-width:1200px) {
      .page-layout {
        grid-template-columns: 1fr;
      }

      .side-banner {
        display:none;
      }
    }

    /* ================= MOTIVATION ================= */

    .side-banner {
      background: rgba(255,255,255,0.05);

      border: 1px solid rgba(255,255,255,0.1);

      border-radius: 16px;

      padding: 18px 15px;

      height: fit-content;

      position: sticky;
      top: 140px;

      display: flex;
      flex-direction: column;

      gap: 15px;
    }

    .banner-title {
      font-size: 1rem;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: 1px;

      color: #38bdf8;

      border-bottom: 1px solid rgba(255,255,255,0.15);

      padding-bottom: 8px;

      text-align: center;
    }

    .quote-card {
      background: rgba(15,23,42,0.65);

      border-left: 3px solid var(--primary-red);

      padding: 10px;

      border-radius: 0 10px 10px 0;

      font-size: 0.86rem;

      line-height: 1.5;

      color: #cbd5e1;
    }

    .quote-card img {
      width: 100%;
      height: 120px;

      object-fit: cover;

      border-radius: 8px;

      margin-bottom: 8px;
    }

    .quote-author {
      display: block;

      margin-top: 7px;

      font-size: 0.76rem;

      color: #94a3b8;

      font-weight: 700;
    }

    /* ================= CONTROLS ================= */

    .controls-bar {
      display: flex;
      flex-direction: column;

      margin-bottom: 15px;

      gap: 10px;
    }

    .top-controls {
      display: flex;

      align-items: center;
      justify-content: space-between;

      gap: 10px;

      flex-wrap: wrap;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      padding: 9px 18px;

      border: none;

      border-radius: 20px;

      background: rgba(255,255,255,0.15);

      color: #fff;

      font-weight: 600;

      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent-blue);

      box-shadow: 0 0 15px rgba(2,132,199,0.5);
    }

    /* ================= COMPACT DATE STRIP ================= */

    .date-strip-wrapper {
      width: 100%;

      background: rgba(255,255,255,0.07);

      border: 1px solid rgba(255,255,255,0.1);

      border-radius: 14px;

      padding: 7px;

      overflow-x: auto;
    }

    .date-strip {
      display: grid;

      grid-template-columns: repeat(7,minmax(75px,1fr));

      gap: 6px;

      min-width: 540px;
    }

    .date-btn {
      border: 1px solid rgba(255,255,255,0.12);

      background: rgba(15,23,42,0.65);

      color: #cbd5e1;

      border-radius: 10px;

      padding: 7px 4px;

      cursor: pointer;

      text-align: center;

      transition: 0.2s;
    }

    .date-btn:hover {
      border-color: #38bdf8;
    }

    .date-btn.active {
      background: var(--accent-blue);

      color: #fff;

      border-color: #38bdf8;

      box-shadow: 0 0 12px rgba(56,189,248,0.25);
    }

    .date-day {
      display: block;

      font-size: 0.68rem;

      font-weight: 700;

      text-transform: uppercase;
    }

    .date-number {
      display: block;

      font-size: 1rem;

      font-weight: 800;
    }

    .date-month {
      display: block;

      font-size: 0.62rem;

      opacity: 0.8;
    }

    /* ================= NEWS ================= */

    .news-grid {
      display: flex;

      flex-direction: column;

      gap: 25px;
    }

    .info-card {
      background: var(--card-bg);

      color: var(--text-dark);

      border-radius: 16px;

      overflow: hidden;

      box-shadow: 0 10px 30px rgba(0,0,0,0.3);

      border-top: 5px solid var(--primary-red);
    }

    .card-header {
      background: #1e293b;

      color: #fff;

      padding: 11px 18px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .badge-cat {
      background: var(--primary-red);

      font-family: 'Roboto Condensed',sans-serif;

      text-transform: uppercase;

      font-size: 0.8rem;

      padding: 4px 9px;

      border-radius: 4px;

      letter-spacing: 1px;

      font-weight: 700;
    }

    .card-id {
      font-weight: 700;

      color: #94a3b8;
    }

    .card-body {
      padding: 20px;

      display: grid;

      grid-template-columns: 1fr 300px;

      gap: 20px;
    }

    @media(max-width:768px) {
      .card-body {
        grid-template-columns: 1fr;
      }

    .card-headline-link {
      text-decoration: none;

      color: #0f172a;

      display: block;
    }

    .card-headline {
      font-size: 1.35rem;

      font-weight: 800;

      line-height: 1.35;

      margin-bottom: 12px;

      cursor: pointer;
    }

    .card-headline:hover {
      color: var(--accent-blue);
    }

    .story-lead {
      font-size: 0.98rem;

      color: #334155;

      line-height: 1.6;

      margin-bottom: 12px;
    }

    .bullet-list {
      list-style: none;

      margin-bottom: 15px;
    }

    .bullet-list li {
      position: relative;

      padding-left: 20px;

      font-size: 0.92rem;

      color: #475569;

      margin-bottom: 6px;

      line-height: 1.5;
    }

    .bullet-list li::before {

      font-size: 1.4rem;

      left: 0;

      top: -3px;

      display: inline-flex;

      background: #e0f2fe;

      border: 1px solid #7dd3fc;

      padding: 2px 8px;

      border-radius: 12px;

      font-size: 0.82rem;

      font-weight: 700;

      cursor: pointer;

      margin: 2px 4px 2px 0;

    .exam-box {
      background: #f1f5f9;

      border-left: 4px solid var(--accent-blue);

      padding: 10px 14px;

      border-radius: 0 8px 8px 0;

      font-size: 0.88rem;

      color: #1e293b;

      margin-bottom: 15px;
    }

    .exam-box strong {
      color: var(--accent-blue);
    }

    .card-footer-actions {
      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-top: 10px;

      gap: 8px;

      flex-wrap: wrap;
    }

    .btn-read-more,
    .btn-official-source,
    .btn-share-item {
      padding: 8px 13px;

      border-radius: 8px;

      font-weight: 700;

      font-size: 0.82rem;

      cursor: pointer;

      border: none;

      text-decoration: none;

      display: inline-flex;

      align-items: center;

      gap: 5px;
    }

    .btn-read-more {
      background: var(--accent-blue);

      color: #fff;
    }

    .btn-official-source {
      background: #475569;

      color: #fff;
    }

    .btn-share-item {
      background: #25d366;

      color: #fff;
    }

    .card-img-container {
      width: 100%;

      height: 220px;

      border-radius: 12px;

      overflow: hidden;

      box-shadow: 0 4px 10px rgba(0,0,0,0.15);

      background: #e2e8f0;
    }

    .card-img-container img {
      width: 100%;

      height: 100%;

      object-fit: cover;
    }

    /* ================= QUIZ ================= */

    .quiz-section {
      display: none;
    }

    .quiz-card {
      background: var(--card-bg);

      color: var(--text-dark);

      border-radius: 16px;

      padding: 20px;

      margin-bottom: 20px;

      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .quiz-q {
      font-size: 1.1rem;

      font-weight: 700;

      margin-bottom: 15px;
    }

    .quiz-options {
      display: flex;

      flex-direction: column;

      gap: 10px;
    }

    .opt-btn {
      text-align: left;

      padding: 12px 16px;

      border: 2px solid #e2e8f0;

      border-radius: 10px;

      background: #fff;

      font-weight: 600;

      cursor: pointer;
    }

    .opt-btn.correct {
      background: #dcfce7 !important;

      border-color: #16a34a !important;

      color: #15803d;
    }

    .opt-btn.wrong {
      background: #ffe4e6 !important;

      border-color: #e11d48 !important;

      color: #be123c;
    }

    /* ================= MODAL ================= */

    .modal-overlay {
      position: fixed;

      inset: 0;

      background: rgba(15,23,42,0.88);

      backdrop-filter: blur(8px);

      z-index: 1000;

      display: none;

      justify-content: center;

      align-items: center;

      padding: 20px;
    }

    .modal-content {
      background: #fff;

      color: var(--text-dark);

      max-width: 850px;

      width: 100%;

      max-height: 90vh;

      overflow-y: auto;

      border-radius: 16px;

      padding: 30px;

      position: relative;

      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
    }

    .close-modal {
      position: absolute;

      top: 12px;

      right: 20px;

      font-size: 1.8rem;

      font-weight: 800;

      cursor: pointer;

      color: #64748b;

      z-index: 5;
    }

    .profile-header {
      display: flex;

      align-items: center;

      gap: 15px;

      border-bottom: 2px solid #e2e8f0;

      padding-bottom: 12px;

      margin-bottom: 15px;
    }

    .profile-avatar {
      width: 60px;

      height: 60px;

      background: #0284c7;

      color: #fff;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 1.5rem;

      font-weight: 800;
    }

    .profile-title h3 {
      font-size: 1.2rem;

      font-weight: 800;
    }

    .profile-title p {
      font-size: 0.88rem;

      color: #0284c7;

      font-weight: 700;
    }

    /* ================= LOADING ================= */

    .loading-box {
      background: rgba(255,255,255,0.08);

      border: 1px solid rgba(255,255,255,0.1);

      border-radius: 14px;

      padding: 35px;

      text-align: center;

      color: #cbd5e1;

      font-weight: 600;
    }

    .error-box {
      background: rgba(244,63,94,0.12);

      border: 1px solid rgba(244,63,94,0.3);

      border-radius: 14px;

      padding: 25px;

      text-align: center;

      color: #fecdd3;
    }
  </style>
</head>

<script>

  let globalPayload = null;
  let currentData = null;


  /* ================= CLOCK ================= */

  function updateClock() {

    const now = new Date();

    const time = now.toLocaleTimeString(
      'en-IN',
      {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: true
      }
    );

    document.getElementById('liveClock').textContent = time;

  }

  setInterval(updateClock,1000);

  updateClock();


  /* ================= INITIAL LOAD ================= */

  async function init() {

    try {

      const response = await fetch(
        'data.json?cache=' + Date.now()
      );

      if(!response.ok) {
        throw new Error(
          `data.json HTTP ${response.status}`
        );
      }

      globalPayload = await response.json();

      if(!globalPayload) {
        throw new Error('Empty data.json');
      }


      /*
       * If Python generated today's data,
       * use it immediately.
       */

      if(
        globalPayload.today &&
        Array.isArray(globalPayload.today.news)
      ) {

        currentData = globalPayload.today;

        renderDateStrip();

        renderAll();

        return;

      }


      /*
       * Otherwise use current_date
       */

      const currentDate =
        globalPayload.current_date ||
        getLocalDate();

      renderDateStrip();

      await loadDateData(currentDate);

    }

    catch(error) {

      console.error(
        'AURA INIT ERROR:',
        error
      );

      showError(
        'Today\'s news could not be loaded. Please run the Python update script and refresh the page.'
      );

    }

  }


  /* ================= DATE STRIP ================= */

  function renderDateStrip() {

    const strip =
      document.getElementById('dateStrip');

    strip.innerHTML = '';

    let dates =
      Array.isArray(globalPayload.available_dates)
        ? [...globalPayload.available_dates]
        : [];


    /*
     * Always include current date if Python
     * has today's data.
     */

    if(
      globalPayload.current_date &&
      !dates.includes(globalPayload.current_date)
    ) {

      dates.push(
        globalPayload.current_date
      );

    }


    /*
     * Sort newest first.
     */

    dates.sort(
      (a,b) =>
        new Date(b) - new Date(a)
    );


    /*
     * Display the latest 7 dates.
     */

    dates =
      dates.slice(0,7);


    dates.forEach(date => {

      const button =
        document.createElement('button');

      button.className =
        'date-btn';

      button.dataset.date =
        date;

      const d =
        new Date(date + 'T00:00:00');

      const weekday =
        d.toLocaleDateString(
          'en-IN',
          {weekday:'short'}
        );

      const day =
        d.toLocaleDateString(
          'en-IN',
          {day:'numeric'}
        );

      const month =
        d.toLocaleDateString(
          'en-IN',
          {month:'short'}
        );


      button.innerHTML = `
        <span class="date-day">
          ${weekday}
        </span>

        <span class="date-number">
          ${day}
        </span>

        <span class="date-month">
          ${month}
        </span>
      `;


      button.onclick =
        () => loadDateData(date);


      strip.appendChild(button);

    });


    /*
     * If there are no archived dates,
     * still show today's date.
     */

    if(!dates.length) {

      const today =
        globalPayload.current_date ||
        getLocalDate();

      const button =
        document.createElement('button');

      button.className =
        'date-btn';

      button.dataset.date =
        today;

      button.innerHTML = `
        <span class="date-day">
          ${new Date(today + 'T00:00:00')
            .toLocaleDateString('en-IN',{weekday:'short'})}
        </span>

        <span class="date-number">
          ${new Date(today + 'T00:00:00')
            .getDate()}
        </span>

        <span class="date-month">
          ${new Date(today + 'T00:00:00')
            .toLocaleDateString('en-IN',{month:'short'})}
        </span>
      `;

  /* ================= LOAD DATE ================= */

  async function loadDateData(selectedDate) {

    try {

      setActiveDate(selectedDate);


      document.getElementById(
        'selectedDateLabel'
      ).textContent =
        formatReadableDate(selectedDate);


      /*
       * IMPORTANT:
       * Today's data comes directly from data.json.
       */

      if(
        globalPayload.today &&
        globalPayload.today.date === selectedDate
      ) {

        currentData =
          globalPayload.today;

      }

      else {

        const response =
          await fetch(
            `data/${selectedDate}.json?cache=${Date.now()}`
          );


        if(!response.ok) {

          throw new Error(
            `No data file found for ${selectedDate}`
          );

        }


        currentData =
          await response.json();

      }


      if(
        !currentData ||
        !Array.isArray(currentData.news)
      ) {

        throw new Error(
          'News array missing from data'
        );

      }


      renderAll();

    }

    catch(error) {

      console.error(
        'DATE LOAD ERROR:',
        error
      );

      showError(
        `No complete current-affairs file was found for ${formatReadableDate(selectedDate)}.`
      );

    }

  }


  function setActiveDate(date) {

    document
      .querySelectorAll('.date-btn')
      .forEach(btn => {

        btn.classList.toggle(
          'active',
          btn.dataset.date === date
        );

      });

  }


  function formatReadableDate(date) {

    const d =
      new Date(date + 'T00:00:00');

    return d.toLocaleDateString(
      'en-IN',
      {
        weekday:'long',
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    );

  }


  function getLocalDate() {

    const d = new Date();

    return [
      d.getFullYear(),
      String(d.getMonth()+1).padStart(2,'0'),
      String(d.getDate()).padStart(2,'0')
    ].join('-');

  }

  /* ================= QUIZ ================= */

  function renderQuiz() {

    const container =
      document.getElementById(
        'quizSection'
      );


    const quizzes =
      Array.isArray(currentData.quizzes)
      ? currentData.quizzes
      : [];


    if(!quizzes.length) {

      container.innerHTML = `
        <div class="quiz-card">
          No quiz is available for this date.
        </div>
      `;

      return;

    }


    container.innerHTML =
      quizzes.map(
        (q,idx) => `

        <div class="quiz-card">

          <div class="quiz-q">
            Q${idx+1}.
            ${escapeHtml(
              q.question || ''
            )}
          </div>

          <div class="quiz-options">

            ${(q.options || [])
              .map(
                (opt,i) => `

                <button
                  class="opt-btn"
                  onclick="
                    checkAnswer(
                      this,
                      ${i},
                      ${Number(q.answer)}
                    )
                  "
                >
                  ${escapeHtml(opt)}
                </button>

              `
              ).join('')
            }

          </div>

        </div>

      `
      ).join('');

  }


  function checkAnswer(
    btn,
    chosen,
    correct
  ) {

    const parent =
      btn.parentElement;

    const buttons =
      parent.querySelectorAll(
        '.opt-btn'
      );


    buttons.forEach(
      (b,idx) => {

        b.disabled = true;

        if(idx === correct) {
          b.classList.add('correct');
        }

        if(
          idx === chosen &&
          chosen !== correct
        ) {
          b.classList.add('wrong');
        }

      }
    );

  }


  /* ================= TABS ================= */

  function switchTab(tab) {

    document
      .getElementById('btnNews')
      .classList.toggle(
        'active',
        tab === 'news'
      );


    document
      .getElementById('btnQuiz')
      .classList.toggle(
        'active',
        tab === 'quiz'
      );


    document
      .getElementById('newsSection')
      .style.display =

        ? 'flex'

    document
      .getElementById('quizSection')
      .style.display =
        tab === 'quiz'
        ? 'block'
        : 'none';

  }


  /* ================= SHARE ================= */

  function shareArticle(title) {

    const decodedTitle =
      decodeURIComponent(title);


    const shareData = {

      title: decodedTitle,

      text:
        `📰 Current Affairs: ${decodedTitle}\n` +
        `Read complete exam notes on AURA EXAM AI!`,

      url: window.location.href

    };


    if(navigator.share) {

      navigator
        .share(shareData)
        .catch(() => {});

    }

    else if(navigator.clipboard) {

      navigator
        .clipboard
        .writeText(
          `${shareData.text}\n${shareData.url}`
        );

      alert(
        'Article link copied to clipboard!'
      );

    }

  }

  /* ================= SECURITY HELPERS ================= */

  function escapeHtml(value) {

    return String(value ?? '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#039;');

  }


  function escapeAttr(value) {

    return escapeHtml(value);

  }


  function escapeJs(value) {

    return String(value ?? '')
      .replace(/\\/g,'\\\\')
      .replace(/'/g,"\\'")
      .replace(/"/g,'\\"')
      .replace(/\n/g,' ');

  }
