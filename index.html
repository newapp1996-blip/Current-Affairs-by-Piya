<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AURA EXAM AI - Daily Current Affairs & Quiz</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Roboto+Condensed:wght@700&display=swap"
    rel="stylesheet"
  />

  <!-- =========================================================
       GOOGLE TRANSLATE
       English is now explicitly included.
       ========================================================= -->
  <script type="text/javascript">
    function googleTranslateElementInit() {
      new google.translate.TranslateElement(
        {
          pageLanguage: "en",
          includedLanguages: "en,hi,pa,bn,ta,te,mr,gu,kn,ml,ur",
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        },
        "google_translate_element"
      );
    }
  </script>

  <script
    type="text/javascript"
    src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"
  ></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(
        135deg,
        #0f172a 0%,
        #1e1b4b 50%,
        #311042 100%
      );

      --card-bg: rgba(255, 255, 255, 0.97);
      --primary-red: #e11d48;
      --accent-blue: #0284c7;
      --accent-cyan: #38bdf8;
      --text-dark: #0f172a;
      --muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bg-gradient);
      min-height: 100vh;
      color: #f8fafc;
      padding-bottom: 50px;
    }

    button,
    select {
      font-family: inherit;
    }

    /* =========================================================
       HEADER
       ========================================================= */

    header {
      text-align: center;
      padding: 15px 15px 12px;
      background: rgba(15, 23, 42, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-top {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      max-width: 1450px;
      margin: 0 auto 10px;
      gap: 15px;
    }

    /* =========================================================
       ATTRACTIVE DIGITAL CLOCK
       ========================================================= */

    .live-clock-box {
      justify-self: start;
      min-width: 155px;
      padding: 9px 14px;
      border-radius: 16px;

      background:
        linear-gradient(
          135deg,
          rgba(56, 189, 248, 0.15),
          rgba(59, 130, 246, 0.05)
        );

      border: 1px solid rgba(56, 189, 248, 0.4);

      box-shadow:
        0 0 20px rgba(56, 189, 248, 0.12),
        inset 0 0 15px rgba(255, 255, 255, 0.03);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #7dd3fc;
    }

    .clock-time {
      font-family: "Roboto Condensed", sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
    }

    .clock-date {
      margin-top: 4px;
      font-size: 0.66rem;
      color: #cbd5e1;
      font-weight: 600;
    }

    .clock-status {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 4px;
      font-size: 0.6rem;
      color: #86efac;
      text-transform: uppercase;
      letter-spacing: 0.7px;
    }

    .clock-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseClock 1.5s infinite;
    }

    @keyframes pulseClock {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.45;
        transform: scale(0.75);
      }
    }

    h1.brand {
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;

      background: linear-gradient(
        90deg,
        #38bdf8,
        #818cf8,
        #f43f5e
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      text-transform: uppercase;
      margin: 0 auto;
    }

    .header-actions {
      justify-self: end;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #google_translate_element {
      min-height: 32px;
    }

    #google_translate_element select {
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--accent-blue);
      border-radius: 12px;
      padding: 5px 10px;
      font-size: 0.82rem;
      font-weight: 600;
      outline: none;
    }

    .btn-share-app {
      background: #10b981;
      color: #fff;
      border: none;
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
    }

    .btn-share-app:hover {
      background: #059669;
      transform: translateY(-1px);
    }

    /* =========================================================
       YOUTUBE
       ========================================================= */

    .yt-banner {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      margin-top: 4px;
      padding: 8px 22px;

      background: #ff0000;
      color: #fff;
      text-decoration: none;
      border-radius: 30px;

      font-weight: 700;
      font-size: 0.92rem;

      box-shadow: 0 4px 15px rgba(255, 0, 0, 0.4);

      transition: 0.2s;
    }

    .yt-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 0, 0, 0.6);
    }

    .yt-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    /* =========================================================
       MAIN GRID
       ========================================================= */

    .page-layout {
      display: grid;
      grid-template-columns: 240px minmax(0, 1fr) 240px;
      gap: 20px;

      max-width: 1550px;
      margin: 20px auto 0;
      padding: 0 15px;
    }

    @media (max-width: 1200px) {
      .page-layout {
        grid-template-columns: 1fr;
      }

      .side-banner {
        display: none;
      }
    }

    /* =========================================================
       MOTIVATIONAL SIDEBARS
       ========================================================= */

    .side-banner {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;

      padding: 15px;
      height: fit-content;

      position: sticky;
      top: 145px;

      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .banner-title {
      font-size: 1rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;

      color: #38bdf8;

      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 8px;

      text-align: center;
    }

    .quote-card {
      background: rgba(15, 23, 42, 0.75);
      border-left: 3px solid var(--primary-red);

      padding: 10px;
      border-radius: 0 10px 10px 0;

      font-size: 0.83rem;
      line-height: 1.45;

      color: #cbd5e1;

      overflow: hidden;
    }

    .quote-card.hi {
      border-left-color: #f59e0b;
    }

    .quote-image {
      width: 100%;
      height: 105px;

      object-fit: cover;

      border-radius: 8px;
      margin-bottom: 8px;

      display: block;
    }

    .quote-text {
      font-weight: 500;
    }

    .quote-author {
      display: block;
      margin-top: 6px;

      font-size: 0.72rem;
      color: #94a3b8;

      text-align: right;
    }

    /* =========================================================
       CONTROLS
       ========================================================= */

    .controls-bar {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 15px;
    }

    .top-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .nav-tabs {
      display: flex;
      gap: 10px;
    }

    .tab-btn {
      padding: 9px 18px;
      border: none;
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.15);
      color: #fff;

      font-weight: 600;
      cursor: pointer;

      transition: 0.3s;
    }

    .tab-btn.active {
      background: var(--accent-blue);
      box-shadow: 0 0 15px rgba(2, 132, 199, 0.5);
    }

    /* =========================================================
       COMPACT CALENDAR
       ========================================================= */

    .calendar-wrapper {
      width: 100%;
      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;

      padding: 9px;
    }

    .calendar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 7px;
      padding: 0 4px;
    }

    .calendar-title {
      font-size: 0.78rem;
      font-weight: 700;
      color: #cbd5e1;
    }

    .calendar-month {
      font-size: 0.78rem;
      font-weight: 700;
      color: #7dd3fc;
    }

    .week-calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 5px;
    }

    .day-cell {
      min-width: 0;
      padding: 6px 3px;

      border: 1px solid transparent;
      border-radius: 9px;

      background: rgba(255, 255, 255, 0.06);
      color: #cbd5e1;

      text-align: center;
      cursor: pointer;

      transition: 0.2s;
    }

    .day-cell:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: rgba(56, 189, 248, 0.4);
    }

    .day-cell.active {
      background: var(--accent-blue);
      color: #fff;
      box-shadow: 0 3px 12px rgba(2, 132, 199, 0.4);
    }

    .day-cell.today {
      border-color: #38bdf8;
    }

    .day-name {
      display: block;
      font-size: 0.58rem;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .day-number {
      display: block;
      font-size: 0.9rem;
      font-weight: 800;
    }

    .day-status {
      display: block;
      font-size: 0.48rem;
      margin-top: 1px;
      color: #86efac;
    }

    .day-cell.active .day-status {
      color: #fff;
    }

    .calendar-nav {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 7px;
    }

    .calendar-nav button {
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;

      width: 27px;
      height: 25px;

      border-radius: 7px;
      cursor: pointer;
      font-weight: 700;
    }

    .calendar-nav button:hover {
      background: var(--accent-blue);
    }

    /* =========================================================
       STATUS / LOADING
       ========================================================= */

    .data-status {
      display: none;

      padding: 16px;
      margin-bottom: 15px;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);

      border-radius: 12px;

      color: #cbd5e1;
      text-align: center;
      font-size: 0.9rem;
    }

    .data-status.error {
      display: block;
      border-color: rgba(244, 63, 94, 0.5);
      color: #fecdd3;
    }

    .data-status.loading {
      display: block;
    }

    /* =========================================================
       NEWS
       ========================================================= */

    .news-grid {
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .info-card {
      background: var(--card-bg);
      color: var(--text-dark);

      border-radius: 16px;
      overflow: hidden;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

      border-top: 5px solid var(--primary-red);

      display: flex;
      flex-direction: column;
    }

    .card-header {
      background: #1e293b;
      color: #fff;

      padding: 12px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .badge-cat {
      background: var(--primary-red);

      font-family: "Roboto Condensed", sans-serif;

      text-transform: uppercase;
      font-size: 0.85rem;

      padding: 4px 10px;
      border-radius: 4px;

      letter-spacing: 1px;
      font-weight: 700;
    }

    .card-id {
      font-weight: 700;
      color: #94a3b8;
      font-size: 0.82rem;
    }

    .card-body {
      padding: 20px;

      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .card-body {
        grid-template-columns: 1fr;
      }
    }

    .card-headline-link {
      text-decoration: none;
      color: #0f172a;
      display: block;
    }

    .card-headline {
      font-size: 1.35rem;
      font-weight: 800;
      line-height: 1.35;
      margin-bottom: 12px;

      transition: color 0.2s;
      cursor: pointer;
    }

    .card-headline-link:hover .card-headline {
      color: var(--accent-blue);
    }

    .story-lead {
      font-size: 0.98rem;
      color: #334155;
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .story-lead b,
    .bullet-list b {
      color: #9f1239;
      font-weight: 700;
      background: rgba(244, 63, 94, 0.1);

      padding: 0 3px;
      border-radius: 2px;
    }

    .bullet-list {
      list-style: none;
      margin-bottom: 15px;
    }

    .bullet-list li {
      position: relative;

      padding-left: 20px;

      font-size: 0.92rem;
      color: #475569;

      margin-bottom: 6px;
      line-height: 1.5;
    }

    .bullet-list li::before {
      content: "•";

      color: var(--primary-red);
      font-size: 1.4rem;

      position: absolute;
      left: 0;
      top: -3px;
    }

    /* =========================================================
       ENTITY CHIPS
       ========================================================= */

    .entity-tag {
      display: inline-flex;
      align-items: center;

      background: #e0f2fe;
      color: #0369a1;

      border: 1px solid #7dd3fc;

      padding: 2px 8px;
      border-radius: 12px;

      font-size: 0.82rem;
      font-weight: 700;

      cursor: pointer;
      margin: 2px 4px 2px 0;

      transition: 0.2s;
    }

    .entity-tag:hover {
      background: #0284c7;
      color: #fff;
    }

    /* =========================================================
       EXAM BOX
       ========================================================= */

    .exam-box {
      background: #f1f5f9;

      border-left: 4px solid var(--accent-blue);

      padding: 10px 14px;

      border-radius: 0 8px 8px 0;

      font-size: 0.88rem;
      color: #1e293b;

      margin-bottom: 15px;
    }

    .exam-box strong {
      color: var(--accent-blue);
    }

    /* =========================================================
       CARD BUTTONS
       ========================================================= */

    .card-footer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-top: 10px;
      gap: 10px;

      flex-wrap: wrap;
    }

    .btn-read-more {
      background: var(--accent-blue);
      color: #fff;

      padding: 8px 16px;
      border-radius: 8px;

      font-weight: 700;
      font-size: 0.85rem;

      border: none;
      cursor: pointer;

      transition: background 0.2s;
    }

    .btn-read-more:hover {
      background: #0369a1;
    }

    .btn-official-source {
      background: #475569;
      color: #fff;

      padding: 8px 14px;
      border-radius: 8px;

      text-decoration: none;

      font-weight: 700;
      font-size: 0.82rem;

      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-official-source:hover {
      background: #334155;
    }

    .btn-share-item {
      background: #25d366;
      color: #fff;

      border: none;

      padding: 8px 16px;
      border-radius: 8px;

      font-weight: 700;
      font-size: 0.85rem;

      cursor: pointer;

      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-share-item:hover {
      background: #1da851;
    }

    .card-img-container {
      width: 100%;
      height: 220px;

      border-radius: 12px;
      overflow: hidden;

      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);

      background: #e2e8f0;
    }

    .card-img-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* =========================================================
       QUIZ
       ========================================================= */

    .quiz-section {
      display: none;
    }

    .quiz-card {
      background: var(--card-bg);
      color: var(--text-dark);

      border-radius: 16px;

      padding: 20px;
      margin-bottom: 20px;

      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .quiz-q {
      font-size: 1.1rem;
      font-weight: 700;

      margin-bottom: 15px;
      color: #0f172a;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .opt-btn {
      text-align: left;

      padding: 12px 16px;

      border: 2px solid #e2e8f0;
      border-radius: 10px;

      background: #fff;

      font-weight: 600;
      cursor: pointer;

      transition: 0.2s;
    }

    .opt-btn:hover {
      border-color: var(--accent-blue);
      background: #f0f9ff;
    }

    .opt-btn.correct {
      background: #dcfce7 !important;
      border-color: #16a34a !important;
      color: #15803d;
    }

    .opt-btn.wrong {
      background: #ffe4e6 !important;
      border-color: #e11d48 !important;
      color: #be123c;
    }

    /* =========================================================
       MODALS
       ========================================================= */

    .modal-overlay {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;
      bottom: 0;

      background: rgba(15, 23, 42, 0.85);

      backdrop-filter: blur(8px);

      z-index: 1000;

      display: none;

      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .modal-content {
      background: #fff;
      color: var(--text-dark);

      max-width: 850px;
      width: 100%;

      max-height: 90vh;

      overflow-y: auto;

      border-radius: 16px;

      padding: 30px;

      position: relative;

      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
